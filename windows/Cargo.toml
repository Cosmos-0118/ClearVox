[package]
name = "clearvox"
version = "0.1.0"
edition = "2021"
description = "Studio-clean voice for Discord, Zoom and games on Windows"
license = "MIT"

[dependencies]
nnnoiseless = { version = "0.5", default-features = false }
wasapi = "0.27"
tray-icon = "0.26"
tao = "0.37"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
anyhow = "1"
log = "0.4"
windows-core = "0.62"

[features]
default = []
# Stronger neural denoiser (DeepFilterNet3 via tract) instead of RNNoise. Larger binary, more CPU.
dfn = ["dep:deep_filter", "dep:ndarray"]

[dependencies.deep_filter]
git = "https://github.com/Rikorose/DeepFilterNet"
tag = "v0.5.6"
default-features = false
features = ["tract", "default-model"]
optional = true

[dependencies.ndarray]
version = "0.15"
optional = true

[dev-dependencies]
realfft = "3"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Console",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

