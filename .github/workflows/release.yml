name: Release

# Push a tag like v1.0.0 to build a universal ClearVox.app and attach it to a GitHub release.
# install.sh downloads releases/latest/download/ClearVox.zip, so users don't need Xcode.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        working-directory: mac
        run: UNIVERSAL=1 ./build.sh

      - name: Package
        run: |
          cd mac/build
          ditto -c -k --keepParent ClearVox.app ../../ClearVox.zip
          cd ../..
          shasum -a 256 ClearVox.zip | tee ClearVox.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClearVox.zip
            ClearVox.zip.sha256
          generate_release_notes: true
