name: Release

# Push a tag like v1.0.0 to build Sordino.app (macOS) and Sordino-windows.zip (Windows) and attach
# them to a GitHub release. Voice models are not part of it: see models.yml (models-vN tags). install.sh / install.ps1 download these, so users need no compilers.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        working-directory: mac
        run: UNIVERSAL=1 ./build.sh

      - name: Package
        run: |
          cd mac/build
          ditto -c -k --keepParent Sordino.app ../../Sordino.zip
          cd ../..
          shasum -a 256 Sordino.zip | tee Sordino.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Sordino.zip
            Sordino.zip.sha256
          generate_release_notes: true

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Build
        working-directory: windows
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item windows/target/release/sordino.exe pkg/
          Compress-Archive -Path pkg/sordino.exe -DestinationPath Sordino-windows.zip
          $h = (Get-FileHash Sordino-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  Sordino-windows.zip" | Tee-Object Sordino-windows.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Sordino-windows.zip
            Sordino-windows.zip.sha256
          generate_release_notes: true

