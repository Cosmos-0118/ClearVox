name: Release

# Push a tag like v1.0.0 to build ClearVox.app (macOS) and ClearVox-windows.zip (Windows) and attach
# them to a GitHub release. install.sh / install.ps1 download these, so users need no compilers.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        working-directory: mac
        run: UNIVERSAL=1 ./build.sh

      - name: Package
        run: |
          cd mac/build
          ditto -c -k --keepParent ClearVox.app ../../ClearVox.zip
          cd ../..
          shasum -a 256 ClearVox.zip | tee ClearVox.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClearVox.zip
            ClearVox.zip.sha256
          generate_release_notes: true

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Build
        working-directory: windows
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item windows/target/release/clearvox.exe pkg/
          Compress-Archive -Path pkg/clearvox.exe -DestinationPath ClearVox-windows.zip
          $h = (Get-FileHash ClearVox-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  ClearVox-windows.zip" | Tee-Object ClearVox-windows.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClearVox-windows.zip
            ClearVox-windows.zip.sha256
          generate_release_notes: true

